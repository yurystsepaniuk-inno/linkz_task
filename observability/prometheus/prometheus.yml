# Prometheus scrape config. The only target that matters here is the
# Collector's prometheus exporter (`:8889`) — everything the apps emit
# arrives via that pipe, not from the apps themselves. That keeps the
# Prometheus → app coupling at zero: scaling the app doesn't require a
# scrape-config update.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: local

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8889']

  # Self-scrape so the dashboard can show Prometheus's own health.
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
